name: Build Image

on:
  pull_request:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    name: Build Docker

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
